name: Bug report
description: Report reproducible behavior that conflicts with canonical requirements.
title: "bug: "
labels:
  - triage
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private keys, real user data, or non-public vulnerability details. Report security issues through the process in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the concrete observed failure.
    validations:
      required: true

  - type: dropdown
    id: boundary
    attributes:
      label: Affected boundary
      options:
        - Route or Reroute
        - Route Engine
        - Confirmed Fact or Proposed Fact
        - Provenance
        - Dependency Graph
        - API or data lifecycle
        - AI trust boundary
        - Adaptive Route View or frontend
        - Security, privacy, or safety
        - Deployment or operations
        - Documentation or governance
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence, including required inputs and state.
      placeholder: |
        1. Start from...
        2. Perform...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Cite the governing document, acceptance test, fixture, or invariant when known.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include sanitized logs, screenshots, or test output where useful.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version, commit, or environment
      description: Identify the affected build or local state.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing report of this behavior.
          required: true
        - label: I removed credentials, private data, and sensitive security details.
          required: true
        - label: I have not proposed a workaround that bypasses a protected trust or sequencing boundary.
          required: true
