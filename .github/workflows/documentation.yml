name: Documentation validation

on:
  # This check is required by the main-branch protection rule, so it must run
  # for every pull request. A path filter here would leave code-only PRs with
  # a permanently missing required check.
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/documentation.yml"
      - "scripts/validate_documentation.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate documentation
        run: python3 scripts/validate_documentation.py
