name: Recovery drill

on:
  schedule:
    - cron: "23 10 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-drill
  cancel-in-progress: false

jobs:
  restore-and-verify:
    name: Restore and verify a throwaway database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pathfinder_source
      AUTH_SECRET: recovery-drill-only-not-a-production-secret
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathfinder_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pathfinder_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply source migrations
        run: pnpm --filter @pathfinder/core db:migrate
      - name: Populate and verify the source database
        run: pnpm --filter web test tests/api-lifecycle.integration.test.ts
      - name: Add a fictional account that predates a deletion request
        run: psql "$POSTGRES_URL" --set=ON_ERROR_STOP=1 --command="insert into \"user\" (id, email, status, locale, \"timeZone\", \"createdAt\", \"updatedAt\") values ('recovery-deletion-user', 'recovery-delete@example.invalid', 'ACTIVE', 'en-US', 'UTC', now(), now())"
      - name: Create the backup
        run: pg_dump "$POSTGRES_URL" --format=custom --file="$RUNNER_TEMP/pathfinder.dump"
      - name: Record the later deletion in the current ledger
        run: |
          subject_hash=$(node -e "process.stdout.write(require('node:crypto').createHash('sha256').update('recovery-deletion-user').digest('hex'))")
          psql "$POSTGRES_URL" --set=ON_ERROR_STOP=1 --command="delete from \"user\" where id = 'recovery-deletion-user'; insert into account_deletion_receipt (id, \"subjectHash\", \"correlationId\", \"deletedAt\") values (gen_random_uuid(), '$subject_hash', 'recovery-drill', now()) on conflict (\"subjectHash\") do nothing"
      - name: Restore into a separate throwaway database
        run: |
          createdb --host=localhost --username=postgres pathfinder_restore
          pg_restore \
            --dbname=postgres://postgres:postgres@localhost:5432/pathfinder_restore \
            --no-owner \
            --no-privileges \
            "$RUNNER_TEMP/pathfinder.dump"
      - name: Reapply deletion state from the current ledger
        run: pnpm --filter @pathfinder/core db:reapply-deletions
        env:
          DELETION_LEDGER_URL: postgres://postgres:postgres@localhost:5432/pathfinder_source
          RESTORE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pathfinder_restore
      - name: Verify the restored account was not resurrected
        run: test "$(psql postgres://postgres:postgres@localhost:5432/pathfinder_restore --tuples-only --no-align --command="select count(*) from \"user\" where id = 'recovery-deletion-user'")" = "0"
      - name: Verify ownership, routing, and lifecycle behavior after restore
        run: pnpm --filter web test tests/api-lifecycle.integration.test.ts
        env:
          POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pathfinder_restore
