name: Neon branch cleanup

# Neon's Vercel integration creates a `preview/<git-branch>` database per preview
# deployment and removes it only when the Vercel *deployment* is removed — six
# months later by default. Merging a PR and deleting the git branch does nothing.
# Each surplus branch bills at ~$1.50/month, so the cost grew by one branch per
# pull request and never came back down. This puts the database on the pull
# request's clock instead of the deployment's.
#
# `pull_request_target`, not `pull_request`, is deliberate. A Dependabot-authored
# `pull_request` run can read only *Dependabot* secrets, so `secrets.NEON_API_KEY`
# would arrive empty and the reap would quietly no-op on a large share of PRs.
# `pull_request_target` runs in the base-repo context and sees Actions secrets for
# every author. It is safe here because this job never checks out or executes pull
# request code — it reads one string and passes it to an API call through the
# environment, never through a shell interpolation.

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "23 8 * * 1"   # weekly backstop: anything the per-PR reap missed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: neon-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reap:
    name: Reap this PR's preview branch
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the Neon preview branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${NEON_PROJECT_ID:-}" ]; then
            echo "::error::NEON_API_KEY secret or NEON_PROJECT_ID variable is missing."
            echo "::error::Refusing to report success from a run that could not authenticate."
            exit 78
          fi

          branch="preview/${HEAD_REF}"
          echo "Target branch: ${branch}"

          # Resolve name -> id. Never interpolate the ref into a URL or a shell word.
          id="$(curl -sS --fail-with-body --get \
                 --data-urlencode "search=${branch}" \
                 -H "Authorization: Bearer ${NEON_API_KEY}" \
                 "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches" \
               | jq -r --arg n "${branch}" \
                 '.branches[] | select(.name == $n and .default != true and .protected != true) | .id' \
               | head -n1)"

          if [ -z "${id}" ] || [ "${id}" = "null" ]; then
            echo "No deletable branch named ${branch}. Nothing to do."
            exit 0
          fi

          echo "Deleting ${id} (${branch})"
          code="$(curl -sS -o /tmp/neon-del.json -w '%{http_code}' -X DELETE \
                    -H "Authorization: Bearer ${NEON_API_KEY}" \
                    "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/branches/${id}")"
          case "${code}" in
            2*)     echo "Deleted ${branch}." ;;
            404|410) echo "Already gone (HTTP ${code})." ;;
            *)      echo "::error::Delete failed with HTTP ${code}"; cat /tmp/neon-del.json; exit 1 ;;
          esac

  sweep:
    name: Weekly sweep of orphaned preview branches
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reap preview branches with no open pull request
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ] || [ -z "${NEON_PROJECT_ID:-}" ]; then
            echo "::error::NEON_API_KEY secret or NEON_PROJECT_ID variable is missing."
            exit 78
          fi
          python3 scripts/neon_branches.py \
            --repo "${GITHUB_REPOSITORY}" \
            --min-age-hours 24 \
            --execute
