name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pathfinder_test
      AUTH_SECRET: ci-only-not-a-production-secret-32

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pathfinder_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: python3 scripts/validate_documentation.py

      - name: Apply test database migrations
        run: pnpm --filter @pathfinder/core db:migrate
        
      - name: Run Lint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm run test

      - name: Install browser acceptance runtime
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: pnpm --filter web test:e2e

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level low

      - name: Build
        run: pnpm run build
