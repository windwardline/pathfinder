name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/pathfinder_test
      AUTH_SECRET: ci-only-not-a-production-secret-32

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pathfinder_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
          
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply test database migrations
        run: pnpm --filter @pathfinder/core db:migrate

      # Runs exactly the gates AGENTS.md declares in its fleet-gates block, so the
      # contract's gate list is executable rather than prose. Byte-identical in
      # every fleet repository with CI; the conformance checker compares it.
      - name: Run declared gates
        run: |
          gates=$(awk '/^```fleet-gates$/{o=1;next} o&&/^```$/{o=0;next} o&&/^gate: /{sub(/^gate: /,"");print}' AGENTS.md)
          [ -n "$gates" ] || { echo "AGENTS.md declares no gate: entry in its fleet-gates block" >&2; exit 1; }
          n=0
          while IFS= read -r gate; do
            [ -n "$gate" ] || continue
            echo "::group::$gate"
            sh -c "$gate"
            echo "::endgroup::"
            n=$((n + 1))
          done <<< "$gates"
          echo "$n declared gate(s) executed."
        

      - name: Install browser acceptance runtime
        run: pnpm --filter web exec playwright install --with-deps chromium webkit

      - name: Run browser acceptance tests
        run: pnpm --filter web test:e2e

