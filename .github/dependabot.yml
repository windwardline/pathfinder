version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    # Seven days here is load-bearing twice over: it is the soak that makes
    # dependabot-auto-merge.yml safe, and it is what keeps this lane compatible
    # with pnpm's own minimumReleaseAge (10080 minutes in pnpm-workspace.yaml).
    # Dependabot resolves the lockfile with pnpm, so a version younger than
    # pnpm's gate would be rejected during resolution rather than merged.
    # fleet-conformance.sh reads this number, not the file's presence.
    cooldown:
      default-days: 7
    # Majors that cannot land yet, held in config rather than by PR comment.
    # `@dependabot ignore <dep> major version` ignores only the ONE major it was
    # commented on: ignoring typescript 7 brought back typescript 6 on the next
    # rebuild, and ignoring @types/node 26 brought back 25. Config-level
    # update-types blocks the whole class, and — unlike comment state, which is
    # invisible in the repo — it is reviewable here. Each entry's blocker is
    # recorded in the deferred-majors issue; lift by deleting the entry.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # One version group and one security group: one lockfile PR per run per
    # kind. Split groups opened two PRs that rewrote pnpm-lock.yaml from one
    # base; both auto-merged and git's text merge broke main (pathfinder
    # #111/#112, 2026-09-21). Majors stay individual PRs — the auto-merge lane
    # holds them for a human, and inside the group one would hold every patch.
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
