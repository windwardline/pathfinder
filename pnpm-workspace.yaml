# Semgrep's pnpm-trust-policy rule wants `trustPolicy: no-downgrade`. It is
# deliberately absent — see the retirement note at the foot of this file for
# the measurement behind that call (49 of 564 locked packages fail it, react
# and esbuild among them). Suppressed here rather than repo-wide so the rule
# still fires if this file is ever restructured.
# nosemgrep: package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy
packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - next
  - '@next/*'
  - '@auth/core'
  - next-auth
  - postcss
  # Fix for GHSA-mh99-v99m-4gvg shipped 2026-07-23, one day before the
  # advisory published — it cannot age past quarantine before we need it.
  - brace-expansion

overrides:
  '@auth/core>cookie': 0.7.2
  '@auth/drizzle-adapter>@auth/core': 0.41.3
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # Everything below 5.0.8 is vulnerable to GHSA-mh99-v99m-4gvg (DoS via
  # unbounded expansion); no fixed 1.x exists, so force the whole tree to
  # the single patched release. Both prior instances were dev-tool chains.
  # 2026-08-03: 5.0.9 — the follow-up advisory (unbounded intermediate
  # arrays bypassing the CVE-2026-14257 mitigation) lands its complete fix.
  'brace-expansion': 5.0.9
  'next@16.2.11>sharp': 0.35.3
  # 2026-08-03: any postcss below 8.5.23 reads attacker-controlled
  # sourceMappingURL .map files when `from` is unset (incomplete fix of
  # GHSA-6g55-p6wh-862q). Two in-range instances (8.5.18 via next,
  # 8.5.19 via @tailwindcss/postcss) — force the whole tree, same
  # posture as brace-expansion above.
  'postcss@<8.5.23': 8.5.23
  # GHSA-2v37-7h3g-55p8: a custom generator loops indefinitely when asked
  # for size zero. One instance, transitive via postcss. 2026-08-13: the
  # advisory widened to `< 3.3.18`, which put the previous 3.3.17 pin
  # inside the vulnerable range. A pin records a judgment about a range,
  # so it has to be re-read every time the range moves — nothing here
  # noticed on its own; the daily osv-scan did, four days later. 3.3.18
  # published 2026-08-07 and clears the seven-day quarantine unaided, so
  # the exclusion this entry used to need is gone.
  'nanoid@<3.3.18': 3.3.18
  # GHSA-5p4m-2wfm-xmqj: prototype pollution in the dev-only YAML loader.
  # 4.3.1 published 2026-07-31, past quarantine on its own.
  'js-yaml@<4.3.1': 4.3.1
patchedDependencies:
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
# trustPolicy: no-downgrade — retired 2026-08-10 (approved by Michael).
#
# It blocked every dependency update in this repo, security updates included,
# while CI stayed green: --frozen-lockfile replays the locked tree without
# re-evaluating trust, so the lockfile was frozen-valid but update-poisoned.
# Any version bump re-resolved subtrees and the policy then rejected packages
# already in the lockfile. Dependabot's npm lane went red on 2026-08-10 after
# four consecutive green weeks.
#
# The operative rule is not the one pnpm's error text states. It is: the
# package has at least one attested version anywhere in its packument and the
# locked version has none. Scanning all 564 locked packages found 49 failures
# — react and react-dom 19.2.4, scheduler, esbuild plus all 26 @esbuild/*
# platform binaries, semver 6.3.1, ms, undici-types. Current mainstream
# releases, not stragglers: React 19.2.4 ships without provenance while 98
# other React versions carry it.
#
# 49 exclusions out of 564 packages is not a policy, it is an exception list
# that must be extended every time a transitive dependency moves — and every
# miss silently re-blocks security patches. npm's provenance coverage does not
# yet support no-downgrade. Note pnpm does not validate this setting: an
# unrecognized value is ignored rather than rejected, so there is no soft mode
# to fall back on.
#
# Still enforced above, and doing the real work: minimumReleaseAge (7-day
# quarantine), blockExoticSubdeps, pinned overrides, and patchedDependencies.
# Revisit if npm provenance reaches the point where the exception list would
# be short enough to read.
