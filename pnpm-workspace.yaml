packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - next
  - '@next/*'
  - '@auth/core'
  - next-auth
  - postcss
  # Fix for GHSA-mh99-v99m-4gvg shipped 2026-07-23, one day before the
  # advisory published — it cannot age past quarantine before we need it.
  - brace-expansion
  # GHSA-2v37-7h3g-55p8 (CVSS 8.2) is fixed in nanoid 3.3.17, published
  # 2026-08-03 — five days old, still inside the seven-day quarantine. Pinned
  # to 3.3.17 rather than the newer 3.3.18 (one day old) so the exclusion
  # gives up as little soak time as the advisory requires.
  - nanoid

overrides:
  '@auth/core>cookie': 0.7.2
  '@auth/drizzle-adapter>@auth/core': 0.41.3
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  # Everything below 5.0.8 is vulnerable to GHSA-mh99-v99m-4gvg (DoS via
  # unbounded expansion); no fixed 1.x exists, so force the whole tree to
  # the single patched release. Both prior instances were dev-tool chains.
  # 2026-08-03: 5.0.9 — the follow-up advisory (unbounded intermediate
  # arrays bypassing the CVE-2026-14257 mitigation) lands its complete fix.
  'brace-expansion': 5.0.9
  'next@16.2.11>sharp': 0.35.3
  # 2026-08-03: any postcss below 8.5.23 reads attacker-controlled
  # sourceMappingURL .map files when `from` is unset (incomplete fix of
  # GHSA-6g55-p6wh-862q). Two in-range instances (8.5.18 via next,
  # 8.5.19 via @tailwindcss/postcss) — force the whole tree, same
  # posture as brace-expansion above.
  'postcss@<8.5.23': 8.5.23
  # GHSA-2v37-7h3g-55p8: predictable IDs from a biased random source. One
  # instance in this lockfile, transitive. See the quarantine note above.
  'nanoid@<3.3.17': 3.3.17
  # GHSA-5p4m-2wfm-xmqj: prototype pollution in the dev-only YAML loader.
  # 4.3.1 published 2026-07-31, past quarantine on its own.
  'js-yaml@<4.3.1': 4.3.1
patchedDependencies:
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
trustPolicy: no-downgrade
trustPolicyExclude:
  # Security patch for four advisories (two CVSS 9.1); published without
  # provenance by the same npm account as the beta.31 already in production
  # (Better Auth team, post-Auth.js transition). Exact version only.
  - 'next-auth@5.0.0-beta.32'
  # Both already in this lockfile and every production build (published
  # 2026-05-25 and 2026-04-17); re-locked unchanged by the brace-expansion
  # override below. Upstream trust tier dropped (Babel/Meta release-infra
  # changes), no advisories or ecosystem reports as of 2026-07-25. Approved
  # by Michael 2026-07-25. Exact versions only.
  - '@babel/core@7.29.7'
  - 'eslint-plugin-react-hooks@7.1.1'
